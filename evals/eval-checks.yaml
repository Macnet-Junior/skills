# These assert test-fixture hygiene, not runtime behavior or agent responses.
- eval: docker-sandboxes-lifecycle
  prompt: "Verification snippet safety (static checks)"
  asset: evals/docker-sandboxes-lifecycle.md
  checks:
    - id: sl-disposable-clone
      description: Clone verification uses the disposable repository and shell agent
      type: file_match
      pattern: '^sbx .* create --clone .* shell "\$REPO"$'
    - id: sl-detached-cwd
      description: Omitted-path verification runs detached from the disposable repository
      type: file_match
      pattern: '^\(cd "\$REPO" && sbx .* run .* -d shell\)$'
    - id: sl-disposable-resume
      description: Stop and resume verification mounts only the disposable repository
      type: file_match
      pattern: '^sbx .* run --name eval-resume -d shell "\$REPO"$'
    - id: sl-no-provider-run
      description: Verification does not launch a provider agent interactively
      type: file_must_not_match
      pattern: '^sbx .* (create|run) .*\b(claude|codex|devin)\b'
    - id: sl-fetch-scoped
      description: Clone fetch is scoped to the disposable repository
      type: file_match
      pattern: '^git -C "\$REPO" fetch sandbox-eval-clone$'

- eval: docker-sandboxes-network-credentials
  prompt: "Verification credential safety (static checks)"
  assets:
    eval: evals/docker-sandboxes-network-credentials.md
    integration: skills/docker-sandboxes-network-credentials/checks/verification.md
  checks:
    - id: sn-dummy-service-token
      description: Service credential verification uses a throwaway token
      type: file_match
      asset_key: eval
      pattern: "^printf 'throwaway-token' \\| sbx .* secret set github$"
    - id: sn-dummy-registry-token
      description: Registry verification uses a throwaway token
      type: file_match
      asset_key: eval
      pattern: "^printf 'throwaway-token' \\| sbx .* --registry ghcr.io --password-stdin$"
    - id: sn-no-production-token
      description: Eval does not read live GitHub credentials
      type: file_must_not_match
      asset_key: eval
      pattern: 'gh auth token|\$(\{)?(GH_TOKEN|GITHUB_TOKEN|ANTHROPIC_API_KEY)\b'
    - id: sn-integration-no-production-token
      description: Integration runbook does not read live GitHub credentials
      type: file_must_not_match
      asset_key: integration
      pattern: 'gh auth token|\$(\{)?(GH_TOKEN|GITHUB_TOKEN)\b'
    - id: sn-sentinel-assertion
      description: Runbook checks the shell agent sentinel rather than printing secrets
      type: file_match
      asset_key: integration
      pattern: 'exec policy-check sh -c.*test "\$ANTHROPIC_API_KEY" = proxy-managed'

